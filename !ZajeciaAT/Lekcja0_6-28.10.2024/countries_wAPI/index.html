<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styles.css">
    <script src="/countries_wAPI/script.js"></script>

    <title>Państwa</title>
</head>
<body>

    <section id="container">

        <section id="mainBox">



            <label for="nameOfCountry">Nazwa państwa:</label> <br>
            <input type="text" name="nameOfCountry" id="nameOfCountry"><br>
            <button id="submit" type="submit" onclick="getNameOfCountry()">Pobierz informacje o państwie</button>

          

            <div id="nazwaPanstwa">

                <p>Nazwa państwa:</p>
                <p id="placeForName"></p>

            </div>

            <div id="nazwaPelnaPanstwa">

                <p>Pełna nazwa państwa:</p>
                <p id="placeForFullName"></p>

            </div>

            <div id="kontynent">

                <p>Kontynent:</p>
                <p id="placeForContinent"></p>

            </div>

            <div id="stolica">

                <p>Stolica:</p>
                <p id="placeForCapital"></p>

            </div>

            <div id="liczbaMieszkancow">

                <p>liczbaMieszkancow:</p>
                <p id="placeForNumberOfCitizens"></p>

            </div>
            
            <div id="godlo">

                <p>Godło:</p>
                <p id="placeForEmblem"></p>

            </div>

            <div id="flaga">

                <p>Flaga:</p>
                <p id="placeForFlag"></p>

            </div>

        </section>

    </section>
    
</body>
</html>
