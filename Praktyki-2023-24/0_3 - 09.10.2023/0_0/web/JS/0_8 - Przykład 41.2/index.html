<!DOCTYPE html>
<html lang="pl-PL">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <script>

        let liczba = Number( prompt( "Podaj liczbę:" ) );

        if( liczba % 2 == 0 )
        {
            alert( "Liczba " + liczba + " jest parzysta" );
        }
        else
        {
            alert( "Liczba " + liczba + " jest nieparzysta" );
        }


    </script>
    
</body>
</html>
