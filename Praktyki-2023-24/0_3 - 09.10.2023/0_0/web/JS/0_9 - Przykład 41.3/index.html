<!DOCTYPE html>
<html lang="pl-PL">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <script>

        let liczba = Number( prompt( "Podaj liczbę: " ) );
        let wynik = ( liczba % 2 == 0 ) ? "parzysta" : "nieparzysta";

        alert( "Liczba " + liczba + " jest " + wynik );

    </script>
    
</body>
</html>
