<!DOCTYPE html>
<html lang="pl-PL">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Document</title>
</head>
<body>
    
    <script>

        let a = Number( prompt( "Podaj 1 liczbę:" ) );
        let b = Number( prompt( "Podaj 2 liczbę:" ) );
        let c = Number( prompt( "Podaj 3 liczbę:" ) );

        let wynik = ( a + b + c ) / 3;

        alert( "Średnia wynosi: " + wynik );

    </script>

</body>
</html>
