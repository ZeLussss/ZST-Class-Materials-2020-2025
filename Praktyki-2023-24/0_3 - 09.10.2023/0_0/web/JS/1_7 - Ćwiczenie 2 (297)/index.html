<!DOCTYPE html>
<html lang="pl-PL">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <span style="color: white;"></span>

    <script>

        let imie = prompt( "Podaj swoje imię: " );
        let nazwisko = prompt( "Podaj swoje nazwisko:" );

        document.write( "<span style=\"color: blue;\">Imie</span>: " + imie + "<br>");
        document.write( "<span style=\"color: red;\">Nazwisko</span>: " + nazwisko );

    </script>
    
</body>
</html>
