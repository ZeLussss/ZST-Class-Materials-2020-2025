</head>
<body>

    <script>

        let a = 8;
        let b = 15;
        let c = 10;

        document.write( "<b>Przed działaniem operatorów przypisania:</b>")
        document.write( "<br>a = " + a + " b = " + b + " c = " + c );

        a += b;
        c *= b;

        document.write( "<br><b>po działaniu operatorów przypisania: </b>")
        document.write( "<br>a = " + a + " b = " + b + " c = " + c );

    </script>
    
</body>
