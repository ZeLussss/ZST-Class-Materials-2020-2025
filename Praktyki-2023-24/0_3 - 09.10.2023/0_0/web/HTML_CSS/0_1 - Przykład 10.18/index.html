<!DOCTYPE html>
<html lang="pl-PL">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <style>

        *
        {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body
        {
            width: 100%;
            height: 100vh;
        }

        #blokA, #blokB, #blokC, #blokD
        {
            width: 50%;
            height: 50%;
            float: left;
        }

        #blokA
        {
            background-image: url( gerbery.png );
            background-color: #eeeeee;
            background-repeat: repeat-x;
        }

        #blokD
        {
            background-image: url( gerbery.png );
            background-color: #cccccc;
            background-repeat: round;
        }

    </style>
    
    <title>Document</title>
</head>
<body>

    <div id="blokA"></div>
    <div id="blokB"></div>
    <div id="blokC"></div>
    <div id="blokD"></div>
    
</body>
</html>
