<!DOCTYPE html>
<html lang="pl-PL">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <style>

        *
        {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body
        {
            width: 100%;
            height: 100vh;
        }

        #baner
        {
            height: 10%;
            background-color: #FFFF99;
            text-align: center;
        }

        #panel_lewy, #panel_srodkowy, #panel_prawy
        {
            height: 80%;
            float: left;
            text-align: center;
        }

        #panel_lewy
        {
            background-color: #FFCC66;
            width: 33%;
        }

        #panel_srodkowy
        {
            background-color: #CCFFFF;
            width: 34%;
        }

        #panel_prawy
        {
            background-color: #CCFF99;
            width: 33%;
        }

        #stopka
        {
            height: 10%;
            text-align: center;
            background-color: #CCCC66;
            clear: both;
        }

    </style>
    
    <title>Document</title>
</head>
<body>

    <div id="baner">Nagłówek strony</div>
    <div id="panel_lewy">Panel lewy</div>
    <div id="panel_srodkowy">Panel środkowy</div>
    <div id="panel_prawy">Panel prawy</div>
    <div id="stopka">Stopka strony</div>    

</body>
</html>
