<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>

        alert( "Pole trapezu" )
        let a1 = prompt( "Podaj wartosc a" );
        a1 = parseInt( a1 );
        if( a1 != null ) 
        {
            let b1 = prompt( "Podaj wartosc b" );
            b1 = parseInt( b1 );
            
            if( b1 != null )
            {
                let wysokosc = prompt( "Podaj wartosc wysokosc" );
                wysokosc = parseInt( wysokosc );
                if( wysokosc != null )
                {
                    let wynik = (( a1 + b1 ) * wysokosc) / 2 ;

                    document.write( "Pole trapezu dla (a = ", a1, ", b = ", b1, ", h = ", wysokosc, ") = ", wynik, '<br><br>' );
                }
            }
        }
    </script>

</head>
<body>

    <script>

        const PI = 3.14;
        
        let r;
        let h;

        alert( "Objętość stożka" );
        r = prompt( "Podaj wartość r" );
        r = parseInt( r );

        if( r != null ) 
        {
            h = prompt( "Podaj wartosc h" );
            h = parseInt( h );

            if( h != null )
            {
                const wynik2 = 1/3 * PI * (r * r) * h;

                document.write( "Objetość stożka wynosi: ", wynik2, '<br><br>' );
            }
        }

    </script>

    <script src="JavaScript_zad4.js">

    </script>

</body>
</html>
