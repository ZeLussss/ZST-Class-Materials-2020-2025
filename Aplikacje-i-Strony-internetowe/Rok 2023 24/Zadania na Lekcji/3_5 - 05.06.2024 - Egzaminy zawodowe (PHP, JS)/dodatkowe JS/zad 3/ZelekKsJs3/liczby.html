<!DOCTYPE html>
<html lang="pl-PL">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styl2.css">

    <script>

        function generujCiag( form )
        {
            let A1          = Number( form.pierwszy.value );
            let R           = Number( form.roznica.value );
            let liczba_wyr  = Number( form.liczba_wyr.value );

            let arrayOfSequences = new Array();

            for( let i = 0; i < liczba_wyr; ++i )
            {
                arrayOfSequences.push( A1 );

                A1 += R;
            }

            let wynik = document.getElementById( "wynik" );
            
            let text = "Ciąg arytmetyczny zawiera wyrazy: ";

            for( let i = 0; i < liczba_wyr; ++i )
            {
                text += arrayOfSequences[ i ];
                text += ", ";
            }

            wynik.innerHTML = text;

            
        }

    </script>

    <title>Ciągi liczbowe</title>
</head>
<body>

    <section id="baner1">

        <h2>Poznaj Ciągi Liczbowe</h2>

    </section>

    <section id="baner2">

        <a href="liczby.html"> <h5>Ciągi arytmetyczne</h5> </a>

    </section>

    <section id="baner3">

        <a href="fib.html"> <h5>Ciąg Fibonacciego</h5> </a>

    </section>

    <section id="baner4">

        <img src="obraz1.png" alt="Fibonacci">

    </section>

    <section id="lewy">

        <ol>

            <li>ciągi arytmetyczne</li>
            <li>ciągi geometryczne</li>
            <li>ciąg Fibonacciego</li>

        </ol>

    </section>

    <section id="prawy">

        <h2>Generowanie ciągu arytmetycznego</h2>

        <form action="" method="dialog">

            <label for="pierwszy">Pierwszy wyraz A1: </label>
            <input type="number" name="pierwszy"> <br>
    
            <label for="roznica">Różnica ciągu R: </label>
            <input type="number" name="roznica"> <br>
    
            <label for="liczba_wyr">Liczba wyrazów w ciągu N: </label>
            <input type="number" name="liczba_wyr"> <br>
    
            <button onclick="generujCiag( this.form )">Generuj Ciąg</button> <br> <br>

            <div id="wynik"></div>

        </form>


    </section>

    <section id="stopka">

        <p>Autor: Ksawery Zelek</p>

    </section>
    
</body>
</html>
