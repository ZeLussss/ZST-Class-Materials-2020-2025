<!DOCTYPE html>
<html lang="pl-PL">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="styl1.css">
    
    <title>Restauracja Wszystkie Smaki</title>
</head>

<body>

    <section class="baner">

        <h1>Witamy w restauracji ,,Wszystkie Smaki"</h1>

    </section>


    <section class="panel_lewy">

        <img src="gf-Yz2K-uho6-f6NT_spaghetti-bolognese-przepis-na-wloskie-danie-dla-4-osob.jpg" alt="Nasze danie">

    </section>


    <section class="panel_prawy">

        <h4>U nas dobrze zjesz!</h4>

        <ul>

            <li>Obiady od 40 zł</li>
            <li>Przekąski od 10 zł</li>
            <li>Kolacje od 20 zł</li>

        </ul>

    </section>


    <section class="panel_dolny">

        <h2>Zarezerwuj stolik on-line</h2>

        <form action="">

            <label for="data">data (format rrrr-mm-dd)</label>
            
            <br>

            <input type="date" id="data" name="data">

            <br>

            <label for="osoby">Ile osób?</label>

            <br>

            <input type="ilosc" id="osoby" name="osoby">

            <br>

            <label for="telefon">Twój numer telefonu:</label>

            <br>

            <input for="text" id="telefon" name="osoby"></input>

            <br>

            <input type="checkbox" id="consent" name="consent">

            <label for="consent">Zgadzam się na przetwarzanie danych osobowych</label>

            <br>

            <input type="reset" value="WYCZYŚĆ">

            <input type="submit" value="REZERWUJ">

        </form>

    </section>


    <section class="stopka">

        Stronę internetową opracował: <span style="font-style: italic;"></span>00000000000</span>

    </section>
    
</body>
</html>
