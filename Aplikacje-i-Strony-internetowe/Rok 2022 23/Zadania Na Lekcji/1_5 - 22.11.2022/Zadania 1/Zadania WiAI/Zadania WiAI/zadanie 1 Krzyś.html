<!DOCTYPE html>
<html>

<head>

    <style>

        div + p + p
        {
            color: red;
        }

    </style>

</head>
<body>
<h4>Zmień kolor wszystkich elementów p, które są potomkami elementów div, na dany kolor</h4>
    <div>
        <p>Zielen</p>
        <p>To czerwony</p>
        <span>
            <p>Rozowy</p>
        </span>
    </div>

    <p>Czerowny</p>
    <p>Niebieski</p>
    <hr>
    <img src="1.png" alt="">
</body>

</html>
